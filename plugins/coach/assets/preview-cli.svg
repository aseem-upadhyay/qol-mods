<svg xmlns="http://www.w3.org/2000/svg" width="706" height="612" viewBox="0 0 706 612" role="img" aria-label="A Claude Code terminal with the coach report open: last week's sessions, prompts and spend; the habit of the week, start fresh when you switch topics, with the session it came from; two CLAUDE.md lines to copy; and a prompt typed five times that could be a skill. Above the prompt, the coach line keeps the habit in view: 2 of 3 switches this week." font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13"><title>A Claude Code terminal with the coach report open: last week's sessions, prompts and spend; the habit of the week, start fresh when you switch topics, with the session it came from; two CLAUDE.md lines to copy; and a prompt typed five times that could be a skill. Above the prompt, the coach line keeps the habit in view: 2 of 3 switches this week.</title><rect x="0.5" y="0.5" width="705" height="611" rx="10" fill="#16161a" stroke="#2e2e36"/><rect x="0.5" y="0.5" width="705" height="30" rx="10" fill="#222228"/><rect x="0.5" y="20" width="705" height="11" fill="#222228"/><circle cx="18" cy="16" r="5.5" fill="#ff5f57"/><circle cx="36" cy="16" r="5.5" fill="#febc2e"/><circle cx="54" cy="16" r="5.5" fill="#28c840"/><text x="353.0" y="20" text-anchor="middle" fill="#8a8a93" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12">claude — my-app</text><text x="18.0" y="52" textLength="163.8" lengthAdjust="spacingAndGlyphs" fill="#e6e6e6" font-weight="700">Your week with Claude</text><text x="447.0" y="52" textLength="187.2" lengthAdjust="spacingAndGlyphs" fill="#8a8a93">28 Sep to 4 Oct · week 4</text><text x="18.0" y="92" textLength="62.4" lengthAdjust="spacingAndGlyphs" fill="#8a8a93">Sessions</text><text x="127.2" y="92" textLength="54.6" lengthAdjust="spacingAndGlyphs" fill="#8a8a93">Prompts</text><text x="236.4" y="92" textLength="39.0" lengthAdjust="spacingAndGlyphs" fill="#8a8a93">Spent</text><text x="361.2" y="92" textLength="179.4" lengthAdjust="spacingAndGlyphs" fill="#8a8a93">Typical cost per prompt</text><text x="18.0" y="112" textLength="15.6" lengthAdjust="spacingAndGlyphs" fill="#e6e6e6" font-weight="700">10</text><text x="41.4" y="112" textLength="31.2" lengthAdjust="spacingAndGlyphs" fill="#8a8a93">+25%</text><text x="119.4" y="112" textLength="15.6" lengthAdjust="spacingAndGlyphs" fill="#e6e6e6" font-weight="700">18</text><text x="142.8" y="112" textLength="31.2" lengthAdjust="spacingAndGlyphs" fill="#8a8a93">+20%</text><text x="220.8" y="112" textLength="39.0" lengthAdjust="spacingAndGlyphs" fill="#e6e6e6" font-weight="700">$6.14</text><text x="267.6" y="112" textLength="31.2" lengthAdjust="spacingAndGlyphs" fill="#e2a33a">+40%</text><text x="345.6" y="112" textLength="39.0" lengthAdjust="spacingAndGlyphs" fill="#e6e6e6" font-weight="700">$0.25</text><text x="392.4" y="112" textLength="23.4" lengthAdjust="spacingAndGlyphs" fill="#8a8a93">−4%</text><text x="18.0" y="152" textLength="132.6" lengthAdjust="spacingAndGlyphs" fill="#d97757" font-weight="700">Habit of the week</text><text x="18.0" y="172" textLength="265.2" lengthAdjust="spacingAndGlyphs" fill="#e6e6e6" font-weight="700">Start fresh when you switch topics</text><text x="18.0" y="192" textLength="561.6" lengthAdjust="spacingAndGlyphs" fill="#e6e6e6">On Wednesday, "Refactor auth middleware" moved on to something new while</text><text x="18.0" y="212" textLength="553.8" lengthAdjust="spacingAndGlyphs" fill="#e6e6e6">it already held about 330k tokens of the earlier topic. Over the next 3</text><text x="18.0" y="232" textLength="390.0" lengthAdjust="spacingAndGlyphs" fill="#e6e6e6">prompts, re-reading that context cost about $1.16.</text><text x="18.0" y="252" textLength="483.6" lengthAdjust="spacingAndGlyphs" fill="#e6e6e6">Try this: Type /clear or start a new session when you move on.</text><text x="18.0" y="272" textLength="148.2" lengthAdjust="spacingAndGlyphs" fill="#8a8a93">[ See the session ]</text><text x="181.8" y="272" textLength="156.0" lengthAdjust="spacingAndGlyphs" fill="#8a8a93">[ What is context? ]</text><text x="353.4" y="272" textLength="171.6" lengthAdjust="spacingAndGlyphs" fill="#8a8a93">[ Pick another habit ]</text><text x="540.6" y="272" textLength="109.2" lengthAdjust="spacingAndGlyphs" fill="#8a8a93">[ Not right? ]</text><text x="18.0" y="312" textLength="265.2" lengthAdjust="spacingAndGlyphs" fill="#d97757" font-weight="700">Teach Claude this project · my-app</text><text x="18.0" y="332" textLength="546.0" lengthAdjust="spacingAndGlyphs" fill="#e6e6e6">my-app has no CLAUDE.md yet. Start one with these lines, or run /init.</text><text x="33.6" y="352" textLength="390.0" lengthAdjust="spacingAndGlyphs" fill="#4eba65">- Test: `pnpm test` (one file: `pnpm test &lt;path&gt;`)</text><text x="33.6" y="372" textLength="187.2" lengthAdjust="spacingAndGlyphs" fill="#4eba65">- Use `pnpm`, not `npm`.</text><text x="18.0" y="392" textLength="600.6" lengthAdjust="spacingAndGlyphs" fill="#8a8a93">In 4 of your last 24 sessions here, Claude searched for how to run the tests.</text><text x="18.0" y="412" textLength="62.4" lengthAdjust="spacingAndGlyphs" fill="#8a8a93">[ Copy ]</text><text x="96.0" y="412" textLength="109.2" lengthAdjust="spacingAndGlyphs" fill="#8a8a93">[ Not right? ]</text><text x="220.8" y="412" textLength="85.8" lengthAdjust="spacingAndGlyphs" fill="#8a8a93">[ Dismiss ]</text><text x="18.0" y="452" textLength="124.8" lengthAdjust="spacingAndGlyphs" fill="#d97757" font-weight="700">Could be a skill</text><text x="18.0" y="472" textLength="483.6" lengthAdjust="spacingAndGlyphs" fill="#e6e6e6">You've typed this 5 times in 5 sessions over the last 4 weeks:</text><text x="33.6" y="492" textLength="546.0" lengthAdjust="spacingAndGlyphs" fill="#4eba65">Write release notes for &lt;version&gt; from the merged prs grouped by area…</text><text x="18.0" y="512" textLength="148.2" lengthAdjust="spacingAndGlyphs" fill="#8a8a93">[ Make it a skill ]</text><text x="181.8" y="512" textLength="132.6" lengthAdjust="spacingAndGlyphs" fill="#8a8a93">[ Copy template ]</text><text x="330.0" y="512" textLength="109.2" lengthAdjust="spacingAndGlyphs" fill="#8a8a93">[ Not right? ]</text><text x="454.8" y="512" textLength="85.8" lengthAdjust="spacingAndGlyphs" fill="#8a8a93">[ Dismiss ]</text><line x1="18" x2="688.8" y1="535" y2="535" stroke="#2e2e36"/><text x="18.0" y="550" textLength="140.4" lengthAdjust="spacingAndGlyphs" fill="#8a8a93">Coach · this week:</text><text x="166.2" y="550" textLength="226.2" lengthAdjust="spacingAndGlyphs" fill="#e6e6e6" font-weight="700">/clear when you switch topics</text><text x="548.4" y="550" textLength="15.6" lengthAdjust="spacingAndGlyphs" fill="#4eba65">●●</text><text x="564.0" y="550" textLength="7.8" lengthAdjust="spacingAndGlyphs" fill="#8a8a93">○</text><text x="579.6" y="550" textLength="117.0" lengthAdjust="spacingAndGlyphs" fill="#8a8a93">2 of 3 switches</text><rect x="12" y="566" width="682.8" height="30" rx="6" fill="none" stroke="#8a8a93" stroke-opacity="0.6"/><text x="18.0" y="586" textLength="7.8" lengthAdjust="spacingAndGlyphs" fill="#8a8a93">&gt;</text></svg>
