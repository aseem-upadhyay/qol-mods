<svg xmlns="http://www.w3.org/2000/svg" width="706" height="296" viewBox="0 0 706 296" role="img" aria-label="The coach line above the prompt in four states: a report ready to read; the habit of the week with this week's progress, 2 of 3; a live hint about a topic change in a big session; and the short form it falls back to when the terminal is narrow." font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13"><title>The coach line above the prompt in four states: a report ready to read; the habit of the week with this week's progress, 2 of 3; a live hint about a topic change in a big session; and the short form it falls back to when the terminal is narrow.</title><text x="18" y="40" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12">Report ready</text><rect x="10" y="48" width="686.8" height="30" rx="6" fill="#16161a" stroke="#2e2e36"/><text x="18.0" y="68" textLength="7.8" lengthAdjust="spacingAndGlyphs" fill="#d97757">●</text><text x="33.6" y="68" textLength="273.0" lengthAdjust="spacingAndGlyphs" fill="#e6e6e6">Coach: your week in review is ready</text><text x="642.0" y="68" textLength="46.8" lengthAdjust="spacingAndGlyphs" fill="#8a8a93">/coach</text><text x="18" y="104" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12">Habit, with this week so far</text><rect x="10" y="112" width="686.8" height="30" rx="6" fill="#16161a" stroke="#2e2e36"/><text x="18.0" y="132" textLength="140.4" lengthAdjust="spacingAndGlyphs" fill="#8a8a93">Coach · this week:</text><text x="166.2" y="132" textLength="226.2" lengthAdjust="spacingAndGlyphs" fill="#e6e6e6" font-weight="700">/clear when you switch topics</text><text x="540.6" y="132" textLength="15.6" lengthAdjust="spacingAndGlyphs" fill="#4eba65">●●</text><text x="556.2" y="132" textLength="7.8" lengthAdjust="spacingAndGlyphs" fill="#8a8a93">○</